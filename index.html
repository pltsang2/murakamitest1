<style id="marakami-sync-v4-style">

  .sync-code{font-size:clamp(46px,10vw,78px);font-weight:900;letter-spacing:.18em;text-align:center;margin:10px 0;color:#6f4b35}

<section id="sync-setup">
  <div class="sync-card">
    <h2>🌼 課堂同步 V4</h2>
    <p>今次直接同步遊戲本身的狀態，不再模擬另一部機的手指動作。填色、拉卷軸、種花都會用原生狀態同步。</p>
    <div class="sync-grid">
      <button id="sync-host-btn" class="sync-btn" type="button">🖥️ 電子白板<br>建立房間</button>
      <button id="sync-student-btn" class="sync-btn secondary" type="button">📱 學生 iPad<br>加入房間</button>
    </div>
    <div id="sync-join-box" class="sync-hidden">
      <input id="sync-room-input" inputmode="numeric" maxlength="4" placeholder="輸入 4 位房間碼">
      <button id="sync-join-btn" class="sync-btn secondary" type="button" style="width:100%;margin-top:10px">加入同步</button>
    </div>
    <button id="sync-solo-btn" class="sync-btn ghost" type="button" style="width:100%;margin-top:13px">單機使用（不連線）</button>
    <div class="sync-note">兩部裝置不需要連同一個 Wi‑Fi，只要都可以上網。正式上堂時，電子白板建立房間，iPad 輸入同一房間碼即可。</div>
  </div>
</section>

<section id="sync-room" class="sync-hidden">
  <div class="sync-card">
    <h2>房間已建立</h2>
    <p>學生 iPad 打開同一個網址，選「學生 iPad」，再輸入：</p>
    <div id="sync-room-code" class="sync-code">----</div>
    <div id="sync-room-status" class="sync-note">正在連線……</div>
    <button id="sync-enter-btn" class="sync-btn" type="button" style="width:100%;margin-top:14px">進入繪本</button>
  </div>
</section>

<div id="sync-bar" class="sync-hidden">
  <div class="sync-pill"><span id="sync-dot" class="sync-dot"></span><span id="sync-status">連線中</span></div>
  <div class="sync-pill sync-extra">房間 <strong id="sync-room-chip">----</strong></div>
  <div class="sync-pill sync-extra" id="sync-role-chip">-</div>
  <button id="sync-now-btn" class="sync-smallbtn" type="button">↻ 重新同步</button>
</div>
<div id="sync-toast"></div>

<script id="marakami-sync-v4-controller">
(()=>{
  const SUPABASE_URL='https://sewveuojxsoqqkjubvrj.supabase.co';
  const SUPABASE_PUBLISHABLE_KEY='sb_publishable_am9k2R7dSgrPTRwT_WWwzQ_uKDZ_Rae';
  const $=id=>document.getElementById(id);
  const deviceId=(crypto.randomUUID?.()||('dev-'+Math.random().toString(36).slice(2)+Date.now().toString(36)));
  let role=null,room=null,channel=null,ready=false;
  let sendChain=Promise.resolve();
  let paintBatch=[],paintTimer=null,pendingScroll=null,scrollTimer=null;
  const client=window.supabase?.createClient?.(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);

  function payload(extra={}){return {...extra,deviceId,role,at:Date.now()};}

    if(!channel||!ready)return Promise.resolve();
    sendChain=sendChain.then(()=>channel.send({type:'broadcast',event,payload:payload(data)})).catch(err=>{console.warn('sync send failed',err);});
    return sendChain;
  }

    if(paintTimer){clearTimeout(paintTimer);paintTimer=null;}

    queueSend('paint-segments',{segments});
  }
  function flushScrollNow(){
    if(scrollTimer){clearTimeout(scrollTimer);scrollTimer=null;}
    if(!pendingScroll)return;
    const value=pendingScroll;pendingScroll=null;
    queueSend('scroll-progress',value);
  }
  function sendSnapshot(snapshot){
    flushPaintNow();flushScrollNow();
    queueSend('state-sync',{snapshot});
  }

  window.__marakamiSync={
    onLocalSnapshot(snapshot){sendSnapshot(snapshot);},
    onLocalPaintSegment(segment){

  }
})();
</script>
